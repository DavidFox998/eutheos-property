name = "eutheos-property"
version = "0.1.0"

-- Single library covering all source directories.
-- Files in Archive/ are NOT listed as build targets — they contain
-- sorry/axiom and are kept for historical reference only.
--
-- Build individual clean files:
--   lake build Bounds.CircuitBounds9
--   lake build Final.ClayFinalClean
-- Build everything clean (CI uses explicit targets in main.yml):
--   lake build

[[lean_lib]]
name = "EutheosProperty"
srcDir = "."
globs = [
  "Bounds.CircuitBounds9",
  "Bounds.ClayBridge5_10",
  "Witness.ClayClaim_fixed",
  "Family.ClayFamilyAlpha0",
  "Family.EutheosAsymptotic",
  "Andreev.ClayAndreevLift",
  "Andreev.ClayAndreevAlpha0",
  "Andreev.ClayN20Measured",
  "Andreev.ClayN25MpmathMeasured",
  "Andreev.ClayN26MpmathMeasured",
  "Andreev.ClayN27MpmathMeasured",
  "Ppoly.ClayPSubPpolyClean",
  "CookLevin.ClayCookLevinClean",
  "MMW.ClayMMWClean",
  "Final.ClayFinalClean",
  "Final.ClayFinalUnifiedClean",
  "Family.Brothers1419",
]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.15.0"
