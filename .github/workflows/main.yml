name: Lean Build -- Clean Proofs

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.15.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Lake update
        run: lake update

      # -- Bounds ----------------------------------------------------------------
      - name: "Bounds -- CircuitBounds9 (CC4=9 exact, native_decide)"
        run: lake build Bounds.CircuitBounds9

      - name: "Bounds -- ClayBridge5_10 (CC5 max=5, n=5 closure)"
        run: lake build Bounds.ClayBridge5_10

      # -- Witness ---------------------------------------------------------------
      - name: "Witness -- ClayClaim_fixed (Nechiporuk 70>51)"
        run: lake build Witness.ClayClaim_fixed

      # -- Family: brother slices ------------------------------------------------
      - name: "Family -- Brothers1419 (16-bit pop6, 35 brothers)"
        run: lake build Family.Brothers1419

      - name: "Family -- Brothers61 (16-bit pop8, 61 brothers, 342 nines)"
        run: lake build Family.Brothers61

      - name: "Family -- Brothers188 (20-bit pop8, 188 brothers, 1026 nines)"
        run: lake build Family.Brothers188

      - name: "Family -- ClayBrothersClean (union bound 35 brothers, L_GapMCSP=2240>33)"
        run: lake build Family.ClayBrothersClean

      - name: "Family -- ExceptionalPrimes (desert {2,3,19,191,p5}, mod-191 injective)"
        run: lake build Family.ExceptionalPrimes

      - name: "Family -- TwinPrimes (twin-pair filter counts, mod-191/193 Nodup)"
        run: lake build Family.TwinPrimes

      - name: "Family -- GapHamming (residue gap > 0, min Hamming ≥ 2)"
        run: lake build Family.GapHamming

      - name: "Family -- HilbertRoute (gate ‖·‖=1, route unitary, jitter Nodup, EMI dB)"
        run: lake build Family.HilbertRoute

      - name: "Family -- PrimesInPi (exceptional set S4, desert empty 192..1000, p5 prime)"
        run: lake build Family.PrimesInPi

      - name: "Family -- BrothersAnalysis (Nodup, popcount-6, 3 primes, leader=1419)"
        run: lake build Family.BrothersAnalysis

      - name: "Family -- AlphaBridge (pi trapped 10-decimal, |alpha0_rat - pi/10| < 6e-11)"
        run: lake build Family.AlphaBridge

      - name: "Family -- IrrationalVsRational (pi/10 irrational, dist>0 for all n, desert)"
        run: lake build Family.IrrationalVsRational

      - name: "Family -- AIZ (35 slots, gate norm=1, hop Nodup ≤1419, packet desert, route unitary)"
        run: lake build Family.AIZ

      # -- Family: Weyl + Dirichlet chain ----------------------------------------
      - name: "Family -- FibonacciChain (pure Weyl N=14..90, Three-Gap theorem)"
        run: lake build Family.FibonacciChain

      - name: "Family -- H4Throat (600-cell throat, phi convergent, 3 boundaries)"
        run: lake build Family.H4Throat

      - name: "Family -- H4Tower (inflation tower N=56/90/146, Fib gaps, density)"
        run: lake build Family.H4Tower

      - name: "Family -- WeylGolden (gaps F7/F8/F9, alpha0 irrational)"
        run: lake build Family.WeylGolden

      - name: "Family -- DirichletGolden (Q5=226, bound=82829, S14 14 primes)"
        run: lake build Family.DirichletGolden

      - name: "Family -- EutheosAsymptotic (N=4M collisions=9 density chain)"
        run: lake build Family.EutheosAsymptotic

      - name: "Family -- ClayFamilyAlpha0 (Dirichlet bounds Q5/Q6)"
        run: lake build Family.ClayFamilyAlpha0

      # -- Family: EMI + pi irrationality ----------------------------------------
      - name: "Family -- DirichletJitterTime (EMI jitter 1420 slices, -30.8dB)"
        run: lake build Family.DirichletJitterTime

      - name: "Family -- PiIrrational (pi certified, aperiodic spread witness)"
        run: lake build Family.PiIrrational

      # -- Protocol --------------------------------------------------------------
      - name: "Protocol -- SuperBric (MORNINGSTAR_1419, 0 sorry, classical trio)"
        run: lake build Protocol.SuperBric

      # -- Andreev ---------------------------------------------------------------
      - name: "Andreev -- ClayAndreevLift (lift formula)"
        run: lake build Andreev.ClayAndreevLift

      - name: "Andreev -- ClayAndreevAlpha0 (alpha0 binding)"
        run: lake build Andreev.ClayAndreevAlpha0

      - name: "Andreev -- ClayN20Measured (4.29B > 24M, 204x)"
        run: lake build Andreev.ClayN20Measured

      - name: "Andreev -- ClayN25MpmathMeasured (3.51T > 1B, 4194x)"
        run: lake build Andreev.ClayN25MpmathMeasured

      - name: "Andreev -- ClayN26MpmathMeasured (13.5T > 2.15B, 7755x)"
        run: lake build Andreev.ClayN26MpmathMeasured

      - name: "Andreev -- ClayN27MpmathMeasured (52T > 4.5B, 14383x)"
        run: lake build Andreev.ClayN27MpmathMeasured

      # -- Ppoly -----------------------------------------------------------------
      - name: "Ppoly -- ClayPSubPpolyClean (TM tableau, Build 93 CLEAN)"
        run: lake build Ppoly.ClayPSubPpolyClean

      # -- CookLevin -------------------------------------------------------------
      - name: "CookLevin -- ClayCookLevinClean (Build 93 CLEAN)"
        run: lake build CookLevin.ClayCookLevinClean

      # -- MMW -------------------------------------------------------------------
      - name: "MMW -- ClayMMWClean (64>33=N^{1.01}, Build 93 CLEAN)"
        run: lake build MMW.ClayMMWClean

      # -- Final -----------------------------------------------------------------
      - name: "Final -- ClayFinalClean (10-way native_decide, forbidden? False)"
        run: lake build Final.ClayFinalClean

      - name: "Final -- ClayFinalUnifiedClean (unified certificate)"
        run: lake build Final.ClayFinalUnifiedClean
